name: Fork APK (signed)

# Fork-only workflow: builds the release APK, signs it with the repository's
# test keystore, and publishes it as a GitHub Release so it can be installed
# directly on a device. Not intended for upstream.

on:
  push:
    branches:
      - fork/apk
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: false
        default: fix/opencode-arm64-install
      tag:
        description: Release tag (defaults to apk-<version>-<shortsha>)
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  apk:
    name: Build and sign release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'fix/opencode-arm64-install' }}
          submodules: recursive
          persist-credentials: false
      # Older refs (e.g. the v1.0.4 tag) predate the .node-version file.
      - name: Ensure Node version file
        run: '[ -f .node-version ] || printf "24.19.0\n" > .node-version'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install repository toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: npm ci --no-audit --no-fund
      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Decode signing keystore
        env:
          HORUS_KEYSTORE_BASE64: ${{ secrets.HORUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$HORUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/horus.p12"
          test -s "$RUNNER_TEMP/horus.p12"
      - name: Sign and verify APK
        id: sign
        env:
          KS_PASS: ${{ secrets.HORUS_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.HORUS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HORUS_KEY_ALIAS }}
        working-directory: android/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/37.0.0"
          VERSION="$("$BT/aapt" dump badging app-release-unsigned.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          SHORT="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          OUT="horus-${VERSION}-arm64-signed.apk"
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="apk-${VERSION}-${SHORT}"
          "$BT/zipalign" -f -p 4 app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/horus.p12" \
            --ks-pass "env:KS_PASS" --key-pass "env:KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" app-release-aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "apk=$PWD/$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.sign.outputs.tag }}"
          APK="${{ steps.sign.outputs.apk }}"
          NOTES="Signed test build from \`${{ inputs.ref }}\` (commit $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)). arm64-v8a only; uninstall any existing Horus signed with a different key first."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
